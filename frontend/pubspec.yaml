name: frontend
description: Astrology web app.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.6.0
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  intl: any
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/signs/
    - assets/images/

  fonts:
    - family: Gothica2
      fonts:
        - asset: assets/fonts/Gothica-Book.ttf
        - asset: assets/fonts/Gothica-BookOblique.ttf
          style: italic
        - asset: assets/fonts/Gothica-Bold.ttf
          weight: 700
        - asset: assets/fonts/Gothica-BoldOblique.ttf
          weight: 700
          style: italic